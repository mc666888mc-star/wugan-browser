<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动点选测试</title>
<style>
  body { background:#141414; color:#e8e8e8; font-family:sans-serif;
         padding:32px 20px; text-align:center; line-height:1.7; }
  h2 { color:#7CFC98; }
  .box { background:#1e1e1e; border:1px solid #333; border-radius:12px;
         padding:20px; margin:24px auto; max-width:420px; }
  .tip { color:#999; font-size:13px; margin-top:24px; }
  b.k { color:#FFD866; }
</style>
</head>
<body>
<h2>🧪 自动点选测试页</h2>
<div class="box">
  <p>下面是一个 Cloudflare Turnstile 验证框，用的是官方测试 key
  <b class="k">（每次必定弹出勾选框，不存在"自己转圈过"）</b>。</p>
  <!-- v10.4：确定性测试靶场。3x00000000000000000000FF 是 CF 官方"强制交互"测试 key -->
  <div class="cf-turnstile" data-sitekey="3x00000000000000000000FF"></div>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</div>
<p>如果无障碍服务正常工作，<b class="k">几秒内它会自动打勾变成 Success</b>，你什么都不用点。</p>
<p class="tip">10 秒后还没打勾 → 点选没工作 → 回设置页点"无障碍"看诊断框<br>
（"验证挂件最后出现 / 最后一次点选"两行会记录发生了什么）</p>
</body>
</html>
